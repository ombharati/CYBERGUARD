name: CYBERGUARD CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cyberguard
          POSTGRES_PASSWORD: cyberguard_secure_password
          POSTGRES_DB: cyberguard_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pytest-asyncio

      - name: Run Database Migrations
        env:
          DATABASE_URL: postgresql://cyberguard:cyberguard_secure_password@localhost:5432/cyberguard_db
          PYTHONPATH: .
        run: |
          alembic upgrade head

      - name: Run Test Suite
        env:
          DATABASE_URL: postgresql://cyberguard:cyberguard_secure_password@localhost:5432/cyberguard_db
          REDIS_URL: redis://localhost:6379/0
          PYTHONPATH: .
        run: |
          pytest -v tests/test_url_detector.py tests/test_email_detection.py tests/test_risk_engine.py tests/test_api.py tests/test_worker_and_queue.py tests/test_large_inputs.py
